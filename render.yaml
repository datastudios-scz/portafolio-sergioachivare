# Blueprint de Render: Dashboard → New → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: portafolio-sergio-achivare
    runtime: static
    buildCommand: echo "Sitio estatico, sin build"
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
